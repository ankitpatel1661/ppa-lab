[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppa-lab"
version = "0.2.0"
description = "Renewable PPA pricing and risk engine for German wind and solar, built on public market and weather data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ankitkumar Patel" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=14",
  "requests>=2.31",
  "matplotlib>=3.8",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
docs = ["markdown>=3.6", "pygments>=2.18"]
# Interactive playground: notebooks/ppa_lab_playground.ipynb (make notebook)
notebook = ["jupyterlab>=4.2", "ipykernel>=6.29", "nbconvert>=7.16"]

[project.scripts]
ppa-lab = "ppa_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked "network" call the real API; they are skipped by default so the
# suite is fast, deterministic and runs offline in CI. Run them with: pytest -m network
addopts = "-q -m 'not network'"
markers = ["network: calls real external APIs (deselected by default)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
