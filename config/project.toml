# =============================================================================
# ppa-lab project configuration
# -----------------------------------------------------------------------------
# One place for every assumption the pipeline makes. Code reads this file via
# ppa_lab.config.load_settings(); nothing below should be hard-coded elsewhere.
# Dates are TOML dates (no quotes) and refer to LOCAL delivery days in
# Europe/Berlin, which is how the market defines a "delivery day".
# =============================================================================

[project]
timezone = "Europe/Berlin"

[market]
# German-Luxembourg bidding zone (one price area since the DE-AT split on 1 Oct 2018).
bidding_zone = "DE-LU"
# Country code used by the Energy-Charts generation endpoint.
country = "de"
# Inclusive range of delivery days to download and analyse.
start = 2023-01-01
end = 2026-09-30

# SDAC harmonised clearing-price limits (EUR/MWh) used as hard sanity bounds.
# A price outside the limit in force on that delivery day cannot be a real
# auction result, so it signals a data or parsing error.
# Source: NEMO Committee / EXAA notice: minimum lowered from -500 to -600 EUR/MWh
# from trading day 28 May 2026 (delivery day 29 May 2026); maximum +4000 EUR/MWh.
[[market.price_limits]]
effective_from = 2023-01-01
min_eur_mwh = -500.0
max_eur_mwh = 4000.0

[[market.price_limits]]
effective_from = 2026-05-29
min_eur_mwh = -600.0
max_eur_mwh = 4000.0

[price_model]
# Step 5: stochastic hourly price model (src/ppa_lab/prices/model.py), calibrated on the
# recent regime (deep solar dips, many negative prices, 15-minute products since Oct 2025).
calibration_start = 2024-01-01
calibration_end = 2026-09-30
# s in y = arcsinh(P / s), EUR/MWh. Chosen by validation over 30-300 (learning track Step 5,
# section 4.3): from 120 on, 7 of 11 statistics fall inside the simulated range (80: 5);
# larger s only makes the negative tail heavier. 120 is the smallest robust choice.
scale_eur_mwh = 120.0
n_paths = 500
seed = 2026
# Delivery year and its forward: the EEX German Power Cal-27 base quote of 9 Oct 2026 (via
# tacto.ai). Until v1.0 the model used an illustrative 85 EUR/MWh (the preparation guide's
# price stack); Step 8's market check showed the market far above it (backlog PPA-8b).
# Later years: [ppa.forward_curve]. Refresh all three with the quotes of the pricing day.
delivery_year = 2027
forward_eur_mwh = 140.21
forward_date = 2026-10-09
forward_source = "https://www.tacto.ai/en/energy/electricity-price"
# Uncertainty of the annual level, in transformed units (depends on s): with s = 120 and a
# 140 EUR/MWh forward, one standard deviation is about 22 EUR/MWh on the level.
level_volatility = 0.12

[price_model.quarter_quotes]
# The market's seasonal shape (Steps 6-8): EEX German Power Base Q1-Q4/27 with the Cal-27 base
# quote of the same day (14 Sep 2026, power2market.com; the latest quarter quotes found).
# Each quarter's forward = forward_eur_mwh x Q / (hour-weighted mean of Q1-Q4), so the year
# still averages forward_eur_mwh. The quotes must average to cal_eur_mwh (same day).
date = 2026-09-14
source = "https://www.power2market.com/de/markets/de/termin"
cal_eur_mwh = 135.80
Q1 = 179.47
Q2 = 114.04
Q3 = 120.35
Q4 = 130.09

[scenarios]
# Step 6: joint weather x price scenarios for [price_model].delivery_year
# (src/ppa_lab/scenarios/). Each complete weather year gets the same number of price paths,
# simulated FOR that year's weather (weather-price link) and, for comparison, without it.
weather_last_year = 2025          # weather years: [weather].first_year .. this year
paths_per_weather_year = 16       # 31 weather years x 16 paths = 496 scenarios
analog_window_days = 30           # intraday patterns from days within +-30 days of the date
analog_k = 10                     # ... drawn among the 10 with the closest weather
validation_exclusion_days = 7     # in-sample check: analogs at least a week from the day
seed = 2027

[ppa]
# Step 7: price a pay-as-produced PPA on the joint scenarios of Step 6
# (src/ppa_lab/pricing/risk.py). Costs are the preparation guide's illustrative values.
start_year = 2027                 # first delivery year = [price_model].delivery_year
tenor_years = 10
discount_rate = 0.06              # annual; cash flows discounted at mid-year
risk_quantile = 0.05              # premia and cash flow at risk at the 5% quantile
# Which historical days represent the delivery year's intraday patterns (learning track
# Step 6, section 4.3): the most recent 12 months, because solar's midday dips deepen
# year by year as capacity grows. The whole window is reported as a sensitivity.
analog_pool_start = 2025-10-01

[ppa.forward_curve]
# Cal base forwards of the later contract years (EEX German Power, EUR/MWh); a year after the
# last one keeps it (flat): long-dated years trade too little for a quote. Cal-28: 9 Oct 2026
# (tacto.ai); Cal-29: 14 Sep 2026 (power2market.com, the latest quote found).
2028 = 104.75
2029 = 87.58

[ppa.parks.solar_park]
balancing_eur_mwh = 1.5           # balancing and route to market
credit_eur_mwh = 1.0              # credit and liquidity
# Solar cannibalisation: the capture rate falls 1 percentage point a year after 2027. History
# fell much faster (0.76 -> 0.59 -> 0.51 in 2023-2025, Step 2) while solar capacity grew;
# batteries, flexible demand and curtailment at negative prices are expected to slow it.
# An assumption, shown with +-1 and -2 pp per year in the Step 7 sensitivities.
capture_rate_drift = -0.01
degradation = 0.005               # PV module degradation, about 0.5 % per year

[ppa.parks.wind_park]
balancing_eur_mwh = 2.0           # wind forecast errors are larger than solar ones
credit_eur_mwh = 1.0
capture_rate_drift = 0.0
degradation = 0.0

[hedging]
# Step 8: hedging the parks' merchant output with power futures (src/ppa_lab/hedging/).
# Back-test: Cal base for year Y sold at year Y-1's average spot price (a naive forward
# proxy: historical futures settlements are not in the public data used here).
backtest_years = [2024, 2025]

# Market reference quotes for German baseload/peak futures, taken from secondary public web
# pages (not EEX settlement files): used for the market check only. Replace or add EEX
# settlements when available.
[[hedging.market_quotes]]
product = "cal_base"
delivery_year = 2027
price_eur_mwh = 104.24
date = 2026-07-31
source = "https://www.tacto.ai/en/energy/electricity-price"

[[hedging.market_quotes]]
product = "cal_base"
delivery_year = 2027
price_eur_mwh = 113.45
date = 2026-08-28
source = "https://www.power2market.com/en/markets"

[[hedging.market_quotes]]
product = "cal_base"
delivery_year = 2027
price_eur_mwh = 135.80
date = 2026-09-14
source = "https://www.power2market.com/de/markets/de/termin"

[[hedging.market_quotes]]
product = "cal_base"
delivery_year = 2027
price_eur_mwh = 126.47
date = 2026-09-29
source = "https://www.tacto.ai/en/energy/electricity-price"

[[hedging.market_quotes]]
product = "cal_base"
delivery_year = 2027
price_eur_mwh = 140.21
date = 2026-10-09
source = "https://www.tacto.ai/en/energy/electricity-price"

[weather]
# ERA5 reanalysis (ECMWF / Copernicus) through the free Open-Meteo archive API.
base_url = "https://archive-api.open-meteo.com/v1"
# 31 complete weather years (1995-2025) for P50/P90 and the Step 6 simulation.
first_year = 1995
# Requests of a whole year count as many API calls; 4 s between requests keeps us
# well inside the free limits (600 calls/min, 5,000/hour).
pause_s = 4.0
license = "CC BY 4.0 - Open-Meteo.com; contains modified Copernicus Climate Change Service information (ERA5)"

[sources.energy_charts]
base_url = "https://api.energy-charts.info"
timeout_s = 60
max_retries = 6
# Seconds to wait between requests: be a polite API citizen.
pause_s = 1.5
license = "CC BY 4.0 - Bundesnetzagentur | SMARD.de, via Energy-Charts (Fraunhofer ISE)"

[paths]
# Relative to the repository root.
raw = "data/raw"
processed = "data/processed"
reports = "reports"
# Small published reference datasets that are committed to the repository.
reference = "data/reference"

# -----------------------------------------------------------------------------
# Step 3: PPA back-tests. Since v1.3 the parks follow two Encavis parks as published in
# Encavis press releases (public data only; not Encavis's own figures or contracts):
# Borrentin solar (114 MWp) and Everswinkel wind (28.5 MW). Step 3 uses the national
# generation profile of their technology, scaled to capacity x full-load hours each year;
# Step 4 replaces this with site models.
# A contract for delivery year Y is signed at Y-1's fair price (naive forward proxy).
# -----------------------------------------------------------------------------
[pricing]
delivery_years = [2024, 2025]
# Floor for the "merchant + floor" structure. 0 EUR/MWh = protection against negative
# prices; economically the same as curtailing whenever the price is below zero.
floor_eur_mwh = 0.0

[pricing.parks.solar_park]
technology = "solar"
# Solar park Borrentin (Mecklenburgische Seenplatte), Encavis, grid-connected December 2024:
# 114 MW, about 200,000 modules, about 121 GWh a year, 10-year PPA with Allego (Encavis press
# release, 5 Dec 2024). Treated as 114 MWp DC; layout details are not published.
capacity_mw = 114         # DC peak capacity (MWp)
full_load_hours = 1061    # Step 3 back-test only: 121 GWh / 114 MWp (published expectation)
# Step 4 site model (pvlib).
site = "Borrentin, Mecklenburg-Western Pomerania"
latitude = 53.81
longitude = 12.98
tilt_deg = 25             # fixed tilt, south-facing (assumed; not published)
azimuth_deg = 180
dc_ac_ratio = 1.2         # 114 MWp DC on 95 MW of inverters (assumed)
# Calibrated so that the P50 matches the published ~121 GWh a year (the model gave 124.3 GWh
# with 10 %): soiling, mismatch, wiring, availability plus site effects the model cannot see.
# The level comes from the operator's yield expectation, the variability and hourly shape
# from ERA5 (as a pricing desk would combine a yield assessment with reanalysis data).
losses_pct = 12.4

[pricing.parks.wind_park]
technology = "wind_onshore"
# Wind park Everswinkel (east of Muenster, NRW), acquired by Encavis in December 2024:
# 28.5 MW = 4 Nordex N149 (5.7 MW, grid since August 2024) + 1 Nordex N163 (5.7 MW); about
# 64 GWh a year; EEG tariff for 20 years (Encavis press release, 4 Dec 2024).
capacity_mw = 28.5
full_load_hours = 2246    # Step 3 back-test only: 64 GWh / 28.5 MW (published expectation)
# Step 4 site model (windpowerlib).
site = "Everswinkel, North Rhine-Westphalia"
latitude = 51.93
longitude = 7.84
# The library has no Nordex N149/N163 curves. The Enercon E-126 EP4 4.2 MW curve has a
# similar specific power (337 W/m2 vs 327 for the N149/5.7, 80 % of the park), scaled to
# 28.5 MW. Hub height is not published: 164 m is the usual N149 height in Germany.
turbine_type = "E-126/4200"
hub_height_m = 164
# Calibrated so that the P50 matches the published ~64 GWh a year: the model with 12 %
# technical losses (wake ~7 %, availability ~3 %, electrical ~2 %) gave 76.5 GWh (+19.5 %).
# The rest covers what a reanalysis model cannot see: sound-reduced night operation and bat
# curtailment (common in NRW), the stand-in power curve and ERA5 winds extrapolated to 164 m.
losses_pct = 26.4

# -----------------------------------------------------------------------------
# Published reference values we "tie out" against (reconciliation).
# tolerance = the absolute difference we accept, because publishers use slightly
# different conventions (e.g. hourly vs quarter-hourly counting).
# -----------------------------------------------------------------------------
[[reconciliation]]
metric = "mean_price_eur_mwh"
year = 2025
value = 89.32
tolerance = 0.5
source = "netztransparenz.de annual spot market value 2025 = 8.932 ct/kWh (DGS evaluation, Jan 2026)"

[[reconciliation]]
metric = "mean_price_eur_mwh"
year = 2024
value = 79.46
tolerance = 0.5
source = "netztransparenz.de Jahresmarktwert JW 2024 = 7.946 ct/kWh"
note = """All of the difference comes from June 2024 (every other month matches to 0.000 ct/kWh). \
On 26 Jun 2024 SDAC was partially decoupled; EEG section 3 no. 42a then prescribes the \
volume-weighted average of all exchanges (EPEX cleared about 492 EUR/MWh, Nord Pool about 103), \
while our source carries about 103 EUR/MWh for that day."""

[[reconciliation]]
metric = "mean_price_eur_mwh"
year = 2023
value = 95.18
tolerance = 0.5
source = "netztransparenz.de Jahresmarktwert JW 2023 = 9.518 ct/kWh"

[[reconciliation]]
metric = "negative_hours"
year = 2025
value = 575
tolerance = 5
source = "DGS evaluation of 2025 market values: 575 h with negative prices (pv magazine reports 573 h)"

[[reconciliation]]
metric = "negative_hours"
year = 2024
value = 459
tolerance = 5
source = "DGS evaluation: 459 h in 2024 (other sources report 457 h)"

[[reconciliation]]
metric = "negative_hours"
year = 2023
value = 301
tolerance = 5
source = "DGS evaluation: 301 h in 2023"

# -----------------------------------------------------------------------------
# Step 2: official annual market values ("Jahresmarktwerte", JW) published by the
# German TSOs on netztransparenz.de, retrieved 8 Oct 2026. Legal formula (EEG 2023
# Anlage 1 Nr. 4.3): sum over all quarter-hours of spot price x generation from the
# TSOs' online extrapolation, divided by total generation, i.e. a capture price.
# Tolerance 0.10 ct/kWh (= 1 EUR/MWh) was fixed BEFORE comparing; differences in the
# generation data source are expected to stay below it.
# -----------------------------------------------------------------------------
[[reconciliation]]
metric = "capture_price_solar_ct_kwh"
year = 2025
value = 4.508
tolerance = 0.10
source = "netztransparenz.de JW Solar 2025"

[[reconciliation]]
metric = "capture_price_solar_ct_kwh"
year = 2024
value = 4.624
tolerance = 0.10
source = "netztransparenz.de JW Solar 2024"

[[reconciliation]]
metric = "capture_price_solar_ct_kwh"
year = 2023
value = 7.200
tolerance = 0.10
source = "netztransparenz.de JW Solar 2023"

[[reconciliation]]
metric = "capture_price_wind_onshore_ct_kwh"
year = 2025
value = 7.441
tolerance = 0.10
source = "netztransparenz.de JW Wind an Land 2025"

[[reconciliation]]
metric = "capture_price_wind_onshore_ct_kwh"
year = 2024
value = 6.293
tolerance = 0.10
source = "netztransparenz.de JW Wind an Land 2024"

[[reconciliation]]
metric = "capture_price_wind_onshore_ct_kwh"
year = 2023
value = 7.621
tolerance = 0.10
source = "netztransparenz.de JW Wind an Land 2023"

[[reconciliation]]
metric = "capture_price_wind_offshore_ct_kwh"
year = 2025
value = 8.059
tolerance = 0.10
source = "netztransparenz.de JW Wind auf See 2025"

[[reconciliation]]
metric = "capture_price_wind_offshore_ct_kwh"
year = 2024
value = 6.777
tolerance = 0.10
source = "netztransparenz.de JW Wind auf See 2024"

[[reconciliation]]
metric = "capture_price_wind_offshore_ct_kwh"
year = 2023
value = 8.187
tolerance = 0.10
source = "netztransparenz.de JW Wind auf See 2023"

# Share of energy produced at non-negative prices ("Vermarktungsmenge"). Secondary
# source (Roedl & Partner, Feb 2026, based on netztransparenz.de data), published as
# whole percentages; tolerance 1 point = rounding plus hourly vs quarter-hourly definition.
[[reconciliation]]
metric = "nonnegative_share_solar_pct"
year = 2025
value = 75
tolerance = 1.0
source = "Roedl & Partner, Wind + Sonne = Strom, Feb 2026: PV-Vermarktungsmenge 2025 = 75 %"

[[reconciliation]]
metric = "nonnegative_share_solar_pct"
year = 2024
value = 81
tolerance = 1.0
source = "Roedl & Partner, Feb 2026: PV-Vermarktungsmenge 2024 = 81 %"

[[reconciliation]]
metric = "nonnegative_share_wind_onshore_pct"
year = 2025
value = 90
tolerance = 1.0
source = "Roedl & Partner, Feb 2026: Wind-an-Land-Vermarktungsmenge 2025 = 90 %"

[[reconciliation]]
metric = "nonnegative_share_wind_onshore_pct"
year = 2024
value = 92
tolerance = 1.0
source = "Roedl & Partner, Feb 2026: Wind-an-Land-Vermarktungsmenge 2024 = 92 %"
